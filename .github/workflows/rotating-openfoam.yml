name: Real transient rotating fan CFD - reference OpenFOAM AMI

on:
  push:
    paths:
      - 'forceforge/rotating_cfd.py'
      - 'pages/15_Transient_Rotating_CFD.py'
      - 'tests/test_rotating_cfd.py'
      - 'tests/test_rotor_visual.py'
      - 'tests/test_transient_cfd_ui.py'
      - '.github/workflows/rotating-openfoam.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install minimum time-series reader and physics API
        run: python -m pip install numpy 'meshio>=5.3,<6' 'pytest>=8,<10' 'streamlit>=1.35,<2' 'plotly>=5.22,<7'
      - name: Static compile and reference CFD provenance/parse tests
        run: |
          python -m compileall -q forceforge/rotating_cfd.py pages/15_Transient_Rotating_CFD.py
          python -m pytest -q tests/test_rotating_cfd.py tests/test_rotor_visual.py tests/test_transient_cfd_ui.py

  actual-blade-resolved-openfoam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal VTK reader and numerical runtime
        run: python -m pip install numpy 'meshio>=5.3,<6'
      - name: Pull official OpenCFD image WITH real tutorial geometry
        run: docker pull opencfd/openfoam-default:2512
      - name: Execute actual rotating fan Navier-Stokes via docker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import time

          from forceforge.rotating_cfd import (
              ROOT, ReferenceControls, launch_reference_job,
              job_status, load_actual_frames
          )

          job_id=launch_reference_job(
              ReferenceControls(rpm=600,end_time_s=.008,write_interval_s=.002)
          )
          print("REAL OPENFOAM JOB:",job_id,flush=True)
          end=time.time()+780
          last=""
          while time.time()<end:
              d=job_status(job_id)
              step=d.get("stage")
              if step!=last:
                  print(json.dumps({
                      "stage":step,
                      "status":d.get("status"),
                      "message":d.get("message"),
                  }),flush=True)
                  last=step
              if d.get("status") in ("FAILED","COMPLETED"):
                  break
              time.sleep(4)
          else:
              raise RuntimeError("Native OpenFOAM transient solve timed out")
          root=ROOT/job_id
          target=Path("qa/rotating_cfd_proof")
          target.mkdir(parents=True,exist_ok=True)
          for fn in ("status.json","copy_openfoam.log","log.pimpleFoam","checkMesh.log",
                     "foamToVTK.log","solver_console.log","launcher.log"):
              src=root/fn
              if src.exists():
                  shutil.copy2(src,target/fn)
          if d.get("status")!="COMPLETED":
              raise AssertionError(
                  "Actual OpenFOAM rotating-mesh/AMI CFD verification failed: "
                  +str(d.get("message"))
              )
          real=load_actual_frames(job_id)
          assert len(real["vtk_record_indices"])>=2
          assert real["velocity_m_s"].shape[-1]==3
          assert real["velocity_m_s"].max() > 0
          shutil.copy2(root/"actual_cfd_frames.npz",
                       target/"actual_cfd_frames.npz")
          print("PASS: genuine OpenFOAM pimpleFoam rotating fan transient U and p",
                d.get("result"),flush=True)
          PY
      - name: Upload true OpenFOAM solver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-openfoam-ami-transient-evidence
          path: qa/rotating_cfd_proof/
          retention-days: 7
          if-no-files-found: ignore
