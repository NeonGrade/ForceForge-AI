name: Solid 3D FEA checks

on:
  push:
    branches: [feature/step-solid-fea]
  pull_request:
    paths:
      - 'forceforge/solid3d.py'
      - 'app_3d.py'
      - 'solid3d_service.py'
      - 'forceforge/solid3d_worker.py'
      - 'web_server.py'
      - 'web/solid3d.*'
      - 'web/index.html'
      - 'web/app.js'
      - 'web/style.css'
      - 'qa/**'
      - 'tests/**'
      - 'requirements-3d.txt'
      - '.github/workflows/solid3d-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-3d-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Gmsh shared library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-3d.txt
      - name: Check browser JS syntax
        run: |
          node --check web/solid3d.js
          node --check web/app.js
      - name: Run full Python test suite
        run: python -m pytest -q
      - name: Isolated subprocess + real Gmsh smoke
        run: |
          python - <<'PY'
          from solid3d_service import run_study
          # Reproduce the exact 100 x 20 x 20 mm / 8 mm screenshot case
          # five consecutive times; no state leaks across child processes.
          for _ in range(5):
              result = run_study({"geometry":"box", "length_mm":100, "width_mm":20, "height_mm":20, "mesh_size_mm":8, "E_gpa":200, "poisson":0.3, "force_n":1000, "axis":"X"})
              assert result["ok"] is True
              assert result["mesh"]["tetrahedra"] > 0
              assert result["metrics"]["equilibrium_residual_n"] < 1e-4
          print("Isolated worker repeated FEA passed")
          PY
      - name: Native Gmsh twice + pre-initialized session + FEA equilibrium
        run: |
          python - <<'PY'
          import numpy as np
          import gmsh
          from forceforge.solid3d import make_box, solve
          for _ in range(2):
              m = make_box(length=0.05, width=0.01, height=0.01, mesh_size=0.01)
              r = solve(m, E=200e9, force_n=1000.0)
              assert np.isfinite(r.von_mises_tet).all()
              assert np.allclose(r.reaction_sum + r.force_sum, 0, atol=1e-4)
          gmsh.initialize()
          try:
              gmsh.model.add("host")
              assert gmsh.model.getCurrent() == "host"
              m = make_box(length=0.05, width=0.01, height=0.01, mesh_size=0.01)
              assert len(m.tet) > 0
              assert gmsh.isInitialized()
              assert gmsh.model.getCurrent() == "host"
          finally:
              gmsh.finalize()
          print("3D Gmsh mesh/FEA regression passed")
          PY


  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install native Gmsh, Python and Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y libglu1-mesa
          python -m pip install -r requirements-3d.txt playwright
          python -m playwright install --with-deps chromium
      - name: Chromium end-to-end six-mode workspace test
        run: python qa/browser_smoke.py
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-workspace-browser-qa
          path: qa/artifacts/*.png
          if-no-files-found: ignore
