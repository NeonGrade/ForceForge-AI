name: Devpost - complete real CAD FEA CFD screen-recorded demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'qa/assemble_devpost_video.py'
      - 'qa/nl_fluid_browser_smoke.py'
      - 'qa/real_step_browser_smoke.py'
      - '.github/workflows/devpost-full-demo.yml'

permissions:
  contents: read
  actions: read

jobs:
  actual-demo-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native CAD and video utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglu1-mesa ffmpeg fonts-dejavu-core
      - name: Install true engineering and Chrome browser stack
        run: |
          python -m pip install -r requirements.txt 'gmsh>=4.12,<5' playwright
          python -m playwright install --with-deps chromium
      - name: Capture real natural language CAD and Gmsh mesh browser session
        run: python qa/nl_fluid_browser_smoke.py
      - name: Capture actual STEP import and 3D tetra10 FEM in browser
        run: python qa/real_step_browser_smoke.py
      - name: Fetch independently verified reference OpenFOAM CFD recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qa/real_flow_demo
          gh run download 43722359161 --repo NeonGrade/ForceForge-AI \
            --name devpost-verified-reference-cfd-video --dir qa/real_flow_demo
      - name: Assemble 2-minute titled and provenance-labeled MP4
        run: python -m qa.assemble_devpost_video
      - name: Upload final demo video and real source screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ForceForgeX-Full-Real-CAD-FEA-CFD-Devpost-Demo
          path: |
            qa/final_devpost_video/ForceForgeX_Devpost_Real_Engineering_Demo.mp4
            qa/final_devpost_video/VIDEO_EVIDENCE.json
            qa/artifacts_nl_fluid/*.png
            qa/artifacts/*.png
          retention-days: 7
          if-no-files-found: ignore
