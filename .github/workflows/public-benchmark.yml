name: Licensed Laboratory Benchmark Raw Data Inspection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-benchmark.yml'
      - 'scripts/inspect_public_benchmark.py'
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific file readers
        run: python -m pip install 'numpy>=2.0' 'scipy>=1.12' 'h5py>=3.10'
      - name: Download official CC-BY research files and print metadata
        run: python -m scripts.inspect_public_benchmark
      - name: Publish provenance-preserving research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hannover-licensed-original-inp-mat
          path: data/third_party/hannover/
          retention-days: 7
