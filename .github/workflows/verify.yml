name: Physics, Product Flow and Regression Checks
on:
  push:
    branches:
      - main
      - "feature/**"
      - "ui/**"
  pull_request:
    branches:
      - main
      - "feature/**"
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python source syntax
        run: python -m compileall -q app.py studio_server.py studio_cad_api.py forceforge pages tests
      - name: Studio JavaScript syntax
        run: node --check studio/app.js && node --check studio/viewport3d.js && node --check studio/adaptive.js && node --check studio/inspection.js
      - name: Numerical verification and golden-case regression
        run: python -m pytest -q
