name: Real STEP / OpenCASCADE Integration
on:
  push:
    paths:
      - 'forceforge/step_mesh.py'
      - 'forceforge/cad_solid.py'
      - 'pages/13_Real_STEP_Engineering.py'
      - 'tests/test_step_gmsh.py'
      - '.github/workflows/real-cad.yml'
  pull_request:
    paths:
      - 'forceforge/step_mesh.py'
      - 'forceforge/cad_solid.py'
      - 'pages/13_Real_STEP_Engineering.py'
      - 'tests/test_step_gmsh.py'
      - '.github/workflows/real-cad.yml'
jobs:
  gmsh-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install OpenGL dependency for Gmsh wheels
        run: sudo apt-get update -qq && sudo apt-get install -y libglu1-mesa
      - name: Install FEA and CAD requirements
        run: python -m pip install -r requirements.txt 'gmsh>=4.12,<5'
      - name: Gmsh STEP import, volume mesh and FEA roundtrip
        run: python -m pytest -q tests/test_step_gmsh.py tests/test_cad_solid.py
