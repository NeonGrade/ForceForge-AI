name: Natural language engineering - schema, CAD and physics gates

on:
  push:
    paths:
      - 'forceforge/engineering_schema.py'
      - 'forceforge/product_cad.py'
      - 'forceforge/engineering_pipeline.py'
      - 'forceforge/fluid_domain.py'
      - 'forceforge/rotor_surface.py'
      - 'pages/14_Natural_Language_Engineering.py'
      - 'pages/13_Real_STEP_Engineering.py'
      - 'app.py'
      - 'tests/test_engineering_schema.py'
      - 'tests/test_engineering_pipeline.py'
      - 'tests/test_nl_native_cad.py'
      - 'tests/test_real_fluid_domain.py'
      - 'tests/test_rotor_surface.py'
      - 'tests/test_nl_ui.py'
      - '.github/workflows/natural-language-engineering.yml'
  pull_request:
    paths:
      - 'forceforge/engineering_schema.py'
      - 'forceforge/product_cad.py'
      - 'forceforge/engineering_pipeline.py'
      - 'forceforge/fluid_domain.py'
      - 'forceforge/rotor_surface.py'
      - 'pages/14_Natural_Language_Engineering.py'
      - 'tests/test_engineering_schema.py'
      - 'tests/test_engineering_pipeline.py'
      - 'tests/test_nl_native_cad.py'
      - 'tests/test_real_fluid_domain.py'
      - 'tests/test_rotor_surface.py'
      - 'tests/test_nl_ui.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-schema-and-real-cad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native Gmsh dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libglu1-mesa
      - name: Install physics stack
        run: python -m pip install -r requirements.txt 'gmsh>=4.12,<5'
      - name: Compile new modules and pages
        run: python -m compileall -q forceforge/engineering_schema.py forceforge/product_cad.py forceforge/engineering_pipeline.py forceforge/fluid_domain.py pages/14_Natural_Language_Engineering.py
      - name: Schema, planner and Streamlit non-execution tests
        run: python -m pytest -q tests/test_engineering_schema.py tests/test_engineering_pipeline.py tests/test_nl_ui.py
      - name: Real isolated Gmsh/OpenCASCADE STEP + genuine bracket tetra10 FEA
        run: python -m pytest -q tests/test_nl_native_cad.py tests/test_real_fluid_domain.py tests/test_rotor_surface.py
      - name: Existing CAD/FEA regression samples
        run: python -m pytest -q tests/test_step_gmsh.py tests/test_cad_solid.py tests/test_isolated_cad.py tests/test_real_step_ui.py

  macos-real-cad:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install physics and native Gmsh on Mac
        run: python -m pip install -r requirements.txt 'gmsh>=4.12,<5'
      - name: Real STEP families, physical pipeline, and UI compatibility
        run: python -m pytest -q tests/test_engineering_schema.py tests/test_engineering_pipeline.py tests/test_nl_native_cad.py tests/test_real_fluid_domain.py tests/test_rotor_surface.py tests/test_nl_ui.py
