name: Live browser - natural language fan CAD and real fluid tetra mesh

on:
  push:
    paths:
      - 'qa/nl_fluid_browser_smoke.py'
      - '.github/workflows/browser-nl-fluid.yml'
      - 'forceforge/fluid_domain.py'
      - 'forceforge/engineering_pipeline.py'
      - 'pages/14_Natural_Language_Engineering.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-browser-and-gmsh:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Native Gmsh loader
        run: sudo apt-get update -qq && sudo apt-get install -y libglu1-mesa
      - name: Install physics stack + browser
        run: |
          python -m pip install -r requirements.txt 'gmsh>=4.12,<5' playwright
          python -m playwright install --with-deps chromium
      - name: Live web frontend / WebSocket / fan STEP and real tetra air mesh
        run: python qa/nl_fluid_browser_smoke.py
      - name: Upload unaltered real screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forceforge-fan-cad-air-volume-browser-evidence
          path: qa/artifacts_nl_fluid/
          retention-days: 7
          if-no-files-found: ignore
