name: Calibrate actual dual-hotspot Gmsh mesh sizes

on:
  push:
    paths:
      - 'scripts/dual_mesh_sweep.py'
      - '.github/workflows/dual-hotspot-mesh-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh-only-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gmsh native graphics dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libglu1-mesa
      - name: Install minimal actual CAD/Gmsh dependencies
        run: python -m pip install numpy 'gmsh>=4.12,<5'
      - name: Evaluate identical STEP with two simultaneous physical Box fields
        run: python -m scripts.dual_mesh_sweep
