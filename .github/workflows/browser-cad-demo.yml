name: Real STEP live-browser demo smoke

on:
  push:
    paths:
      - 'qa/real_step_browser_smoke.py'
      - '.github/workflows/browser-cad-demo.yml'
      - 'forceforge/cad_copilot.py'
      - 'pages/13_Real_STEP_Engineering.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-cad-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Native Gmsh dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libglu1-mesa
      - name: Install Python physics and browser tools
        run: |
          python -m pip install -r requirements.txt 'gmsh>=4.12,<5' playwright
          python -m playwright install --with-deps chromium
      - name: Real browser / WebSocket / STEP / FEM smoke
        run: python qa/real_step_browser_smoke.py
      - name: Upload genuine demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forceforge-real-step-browser-screenshots
          path: qa/artifacts/
          retention-days: 7
          if-no-files-found: ignore
